name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest --cov=opsproof --cov=evaluation --cov-report=term-missing
      - run: python -m compileall -q opsproof evaluation app.py
      - run: python -m evaluation.benchmark --json
