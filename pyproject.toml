[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opsproof"
version = "1.0.0"
description = "Explainable deterministic runbook quality and safety assurance"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2,<3", "PyYAML>=6", "python-docx>=1", "networkx>=3",
  "sqlglot>=25", "bashlex>=0.18", "z3-solver>=4.12", "streamlit>=1.32",
  "plotly>=5", "reportlab>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["examples"]

[tool.ruff.lint]
ignore = ["E401", "E501", "E701", "E702", "E703"]
