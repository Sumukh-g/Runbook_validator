{
  "name": "Kubernetes",
  "version": "1.0",
  "rules": [
    {
      "id": "K8S-001",
      "name": "Namespace-sensitive command omits namespace",
      "category": "command_safety",
      "description": "Namespace-sensitive command omits namespace.",
      "rationale": "Domain policy requirement.",
      "severity": "high",
      "enabled": true,
      "evaluator": "k8s_no_namespace",
      "score_penalty": 8,
      "remediation": "Add the missing domain-specific control and evidence."
    },
    {
      "id": "K8S-002",
      "name": "Cluster-wide mutation",
